<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 7 Flashcards — Introduction to Web Applications</title>
<style>
  :root{--bg:#0c0d10;--card:#111217;--stroke:#2a2f3a;--accent:#ff6a00;--text:#f5f7fb;--dim:#b8c0cf}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);background-image:radial-gradient(1000px 600px at -10% -20%, rgba(255,106,0,.20), transparent 50%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 60px}
  header{text-align:center;margin-bottom:28px}
  h1{margin:0;font-size:30px;font-weight:900}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--dim);font-size:14px;margin-top:8px}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .btn{border:1px solid var(--stroke);background:rgba(255,255,255,.02);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;font-size:14px}
  .btn:hover{background:rgba(255,106,0,.10)}
  .counter{color:var(--dim);font-size:14px}
  .stage{display:flex;justify-content:center}
  .scene{width:100%;max-width:640px;height:360px;perspective:1600px}
  .card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--stroke);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--card)}
  .face.front{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.15)), var(--card)}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg, rgba(255,106,0,.10), rgba(0,0,0,.15)), var(--card);border-color:#b85100}
  .tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#ffd9bf;background:rgba(255,106,0,.15);border:1px solid rgba(255,106,0,.35);padding:4px 10px;border-radius:999px}
  .term{font-size:23px;font-weight:900}
  .def{font-size:17px;line-height:1.5;color:var(--dim)}
  .hint{position:absolute;bottom:16px;font-size:12px;color:#8891a1}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap;max-width:640px;margin-left:auto;margin-right:auto}
  .dot{width:9px;height:9px;border-radius:999px;background:var(--stroke);cursor:pointer}
  .dot.active{background:var(--accent)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;font-size:12.5px;color:#8891a1;max-width:640px;margin-left:auto;margin-right:auto}
  .wordmark{font-weight:900;letter-spacing:2px}
  .wordmark .c{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OSCP <span class="accent">Flashcards</span></h1><div class="sub">Module 7 &middot; Introduction to Web Applications</div></header>
  <div class="toolbar">
    <button class="btn" id="prevBtn">⟨ Prev</button>
    <span class="counter" id="counter">1 / 16</span>
    <button class="btn" id="nextBtn">Next ⟩</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
  </div>
  <div class="stage"><div class="scene"><div class="card" id="card">
    <div class="face front"><div class="tag" id="tagFront">Methodology</div><div class="term" id="termText">Term</div><div class="hint">Tap card to reveal definition</div></div>
    <div class="face back"><div class="tag" id="tagBack">Methodology</div><div class="def" id="defText">Definition</div><div class="hint">Tap card to flip back</div></div>
  </div></div></div>
  <div class="dots" id="dots"></div>
  <div class="foot"><div>My Cyber Academy</div><div class="wordmark"><span class="c">OS</span>CP</div></div>
</div>
<script>
const cards = [
  {tag:"Methodology", term:"Black Box Testing", def:"No prior knowledge or credentials — the tester approaches exactly as an anonymous external user would."},
  {tag:"Methodology", term:"Grey Box Testing", def:"Partial knowledge, often including limited credentials, simulating a low-privilege authenticated user."},
  {tag:"Methodology", term:"White Box Testing", def:"Full access, including source code and architecture documentation, for the deepest possible assessment."},
  {tag:"Methodology", term:"OWASP Top 10", def:"A widely referenced list of critical web application risk categories, used as a reference map — not itself the course's scope, which is defined by its own Learning Objectives."},
  {tag:"Tools", term:"Web Proxy", def:"Sits between browser and application, intercepting every request/response so a tester can read and modify traffic the browser would send automatically — removing the browser's own limits."},
  {tag:"Tools", term:"Burp Suite: Proxy", def:"Intercepts live traffic between browser and application for inspection or modification before it is sent."},
  {tag:"Tools", term:"Burp Suite: Repeater", def:"Resends a captured request repeatedly with manual edits — ideal for probing a single parameter."},
  {tag:"Tools", term:"Burp Suite: Intruder", def:"Automates sending many variations of a request — useful for brute-forcing or fuzzing a specific field."},
  {tag:"Enumeration", term:"Web-Layer Enumeration", def:"Directory/file brute-forcing, technology fingerprinting from headers and error pages, and mapping visible functionality — Module 5's discipline applied at the application layer."},
  {tag:"Enumeration", term:"Client-Side Source Review", def:"Fully visible HTML/JS often reveals bypassable validation logic, hidden form fields, developer comments, and unlinked endpoint paths."},
  {tag:"Enumeration", term:"Headers, Cookies, APIs", def:"Headers reveal server/framework versions and missing security controls; cookie flags govern script/transport protection; APIs often carry weaker validation than the interface built on them."},
  {tag:"XSS", term:"Reflected XSS", def:"Payload travels in the request itself and is immediately echoed back — requires luring a victim to a specifically crafted link. Impact limited to that victim."},
  {tag:"XSS", term:"Stored XSS", def:"Payload is saved server-side and served to every subsequent visitor — no crafted link required. Generally the more severe of the two named types."},
  {tag:"XSS", term:"DOM-Based XSS", def:"Payload never reaches the server — client-side JavaScript itself unsafely inserts attacker-controlled data into the page."},
  {tag:"XSS", term:"XSS Privilege Escalation", def:"A script executing in a victim's authenticated session acts with that victim's privileges — turns a client-side finding into a genuine account compromise, especially against an administrator."},
  {tag:"Practice", term:"Confirming XSS Type", def:"Test whether a payload persists for a second, unauthenticated visitor with no crafted link — persistence confirms stored; its absence points to reflected or DOM-based."}
];
let order = cards.map((_,i)=>i); let pos = 0;
const cardEl=document.getElementById('card'),termText=document.getElementById('termText'),defText=document.getElementById('defText'),tagFront=document.getElementById('tagFront'),tagBack=document.getElementById('tagBack'),counter=document.getElementById('counter'),dotsEl=document.getElementById('dots');
function renderDots(){dotsEl.innerHTML='';order.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===pos?' active':'');d.onclick=()=>{pos=i;render();};dotsEl.append(d);});}
function render(){const c=cards[order[pos]];cardEl.classList.remove('flipped');termText.textContent=c.term;defText.textContent=c.def;tagFront.textContent=c.tag;tagBack.textContent=c.tag;counter.textContent=(pos+1)+' / '+order.length;renderDots();}
cardEl.addEventListener('click',()=>cardEl.classList.toggle('flipped'));
document.getElementById('nextBtn').onclick=()=>{pos=(pos+1)%order.length;render();};
document.getElementById('prevBtn').onclick=()=>{pos=(pos-1+order.length)%order.length;render();};
document.getElementById('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('nextBtn').click();if(e.key==='ArrowLeft')document.getElementById('prevBtn').click();if(e.key===' '){e.preventDefault();cardEl.classList.toggle('flipped');}});
render();
</script>
</body>
</html>
