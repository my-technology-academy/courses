<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 4 Flashcards — Report Writing for Penetration Testers</title>
<style>
  :root{--bg:#0c0d10;--card:#111217;--stroke:#2a2f3a;--accent:#ff6a00;--text:#f5f7fb;--dim:#b8c0cf}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);background-image:radial-gradient(1000px 600px at -10% -20%, rgba(255,106,0,.20), transparent 50%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 60px}
  header{text-align:center;margin-bottom:28px}
  h1{margin:0;font-size:30px;font-weight:900}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--dim);font-size:14px;margin-top:8px}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .btn{border:1px solid var(--stroke);background:rgba(255,255,255,.02);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;font-size:14px}
  .btn:hover{background:rgba(255,106,0,.10)}
  .counter{color:var(--dim);font-size:14px}
  .stage{display:flex;justify-content:center}
  .scene{width:100%;max-width:640px;height:360px;perspective:1600px}
  .card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--stroke);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--card)}
  .face.front{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.15)), var(--card)}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg, rgba(255,106,0,.10), rgba(0,0,0,.15)), var(--card);border-color:#b85100}
  .tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#ffd9bf;background:rgba(255,106,0,.15);border:1px solid rgba(255,106,0,.35);padding:4px 10px;border-radius:999px}
  .term{font-size:23px;font-weight:900}
  .def{font-size:17px;line-height:1.5;color:var(--dim)}
  .hint{position:absolute;bottom:16px;font-size:12px;color:#8891a1}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap;max-width:640px;margin-left:auto;margin-right:auto}
  .dot{width:9px;height:9px;border-radius:999px;background:var(--stroke);cursor:pointer}
  .dot.active{background:var(--accent)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;font-size:12.5px;color:#8891a1;max-width:640px;margin-left:auto;margin-right:auto}
  .wordmark{font-weight:900;letter-spacing:2px}
  .wordmark .c{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OSCP <span class="accent">Flashcards</span></h1><div class="sub">Module 4 &middot; Report Writing for Penetration Testers</div></header>
  <div class="toolbar">
    <button class="btn" id="prevBtn">⟨ Prev</button>
    <span class="counter" id="counter">1 / 16</span>
    <button class="btn" id="nextBtn">Next ⟩</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
  </div>
  <div class="stage"><div class="scene"><div class="card" id="card">
    <div class="face front"><div class="tag" id="tagFront">Note-Taking</div><div class="term" id="termText">Term</div><div class="hint">Tap card to reveal definition</div></div>
    <div class="face back"><div class="tag" id="tagBack">Note-Taking</div><div class="def" id="defText">Definition</div><div class="hint">Tap card to flip back</div></div>
  </div></div></div>
  <div class="dots" id="dots"></div>
  <div class="foot"><div>My Cyber Academy</div><div class="wordmark"><span class="c">OS</span>CP</div></div>
</div>
<script>
const cards = [
  {tag:"Note-Taking", term:"Note Portability", def:"The ability of notes to leave their originating tool intact, in a durable, non-proprietary format. Chosen on day one, not retrofitted once volume makes migration painful."},
  {tag:"Note-Taking", term:"Documentation Structure", def:"Scope and targets, actions taken, results observed, findings extracted — the general structure of live pentesting documentation, traceable from any finding back to its source action."},
  {tag:"Note-Taking", term:"Screenshot Discipline", def:"Every screenshot should show a visible identifier (host/IP/prompt), the command that produced the state, and an unambiguous result — otherwise it is not independently verifiable evidence."},
  {tag:"Note-Taking", term:"Engagement Deliverables", def:"The technical report is primary; raw notes, screenshots and proof-of-concept material are supporting deliverables it is built from."},
  {tag:"Report Structure", term:"Executive Summary", def:"Non-technical section stating scope, overall risk posture, the highest-priority findings in triad terms, and priority actions. Often the only section a decision-maker reads."},
  {tag:"Report Structure", term:"Technical Summary", def:"Bridges the executive summary and detailed findings: methodology, tooling at a category level, finding counts by severity, and any chained attack path."},
  {tag:"Report Structure", term:"Environment Considerations", def:"The testing window, scope exclusions, and environmental constraints stated explicitly so a reader cannot mistake a scoped result for an unconditional one."},
  {tag:"Report Structure", term:"Finding Anatomy", def:"Description, evidence, impact, recommendation — the fixed structure every individual finding follows so it can be compared and acted on independently."},
  {tag:"Report Structure", term:"Appendices and References", def:"Home for raw output and extended logs that support a finding but would break the reading flow. Never a substitute for evidence within the finding itself."},
  {tag:"Writing Practice", term:"Purpose of a Report", def:"To enable client decisions — what to fix first, what to accept as residual risk — not to document tester effort or narrate the engagement."},
  {tag:"Writing Practice", term:"Tailoring Content", def:"Writing each section for its actual reader: board for consequence, security manager for technical detail, engineer for exact reproduction steps."},
  {tag:"Writing Practice", term:"Write the Summary Last", def:"Draft every finding before the executive summary. Summarising requires knowing what was actually found, not what was expected at the outset."},
  {tag:"Writing Practice", term:"Executive vs Technical Language", def:"The executive summary carries no tool names or CVE identifiers — those belong in the technical summary and findings, written for a reader who understands them."},
  {tag:"Writing Practice", term:"Chained Findings", def:"Multiple weaknesses used in sequence toward one outcome. Whether they are reported as one finding or several depends on the reader and what action each implies."},
  {tag:"Course Practice", term:"Record Live, Not From Memory", def:"Notes written from memory after the fact are reconstructions and lose exactly the detail a report later needs. Record the command, output and reasoning the moment each step is taken."},
  {tag:"Course Practice", term:"Templating the Finding", def:"Build the four-field finding template before any findings exist. An empty template gets filled in under pressure; a blank page gets postponed."}
];
let order = cards.map((_,i)=>i); let pos = 0;
const cardEl=document.getElementById('card'),termText=document.getElementById('termText'),defText=document.getElementById('defText'),tagFront=document.getElementById('tagFront'),tagBack=document.getElementById('tagBack'),counter=document.getElementById('counter'),dotsEl=document.getElementById('dots');
function renderDots(){dotsEl.innerHTML='';order.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===pos?' active':'');d.onclick=()=>{pos=i;render();};dotsEl.append(d);});}
function render(){const c=cards[order[pos]];cardEl.classList.remove('flipped');termText.textContent=c.term;defText.textContent=c.def;tagFront.textContent=c.tag;tagBack.textContent=c.tag;counter.textContent=(pos+1)+' / '+order.length;renderDots();}
cardEl.addEventListener('click',()=>cardEl.classList.toggle('flipped'));
document.getElementById('nextBtn').onclick=()=>{pos=(pos+1)%order.length;render();};
document.getElementById('prevBtn').onclick=()=>{pos=(pos-1+order.length)%order.length;render();};
document.getElementById('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('nextBtn').click();if(e.key==='ArrowLeft')document.getElementById('prevBtn').click();if(e.key===' '){e.preventDefault();cardEl.classList.toggle('flipped');}});
render();
</script>
</body>
</html>
