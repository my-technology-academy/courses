<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 8 Flashcards — Common Web Application Attacks</title>
<style>
  :root{--bg:#0c0d10;--card:#111217;--stroke:#2a2f3a;--accent:#ff6a00;--text:#f5f7fb;--dim:#b8c0cf}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);background-image:radial-gradient(1000px 600px at -10% -20%, rgba(255,106,0,.20), transparent 50%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 60px}
  header{text-align:center;margin-bottom:28px}
  h1{margin:0;font-size:30px;font-weight:900}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--dim);font-size:14px;margin-top:8px}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .btn{border:1px solid var(--stroke);background:rgba(255,255,255,.02);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;font-size:14px}
  .btn:hover{background:rgba(255,106,0,.10)}
  .counter{color:var(--dim);font-size:14px}
  .stage{display:flex;justify-content:center}
  .scene{width:100%;max-width:640px;height:360px;perspective:1600px}
  .card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--stroke);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--card)}
  .face.front{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.15)), var(--card)}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg, rgba(255,106,0,.10), rgba(0,0,0,.15)), var(--card);border-color:#b85100}
  .tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#ffd9bf;background:rgba(255,106,0,.15);border:1px solid rgba(255,106,0,.35);padding:4px 10px;border-radius:999px}
  .term{font-size:23px;font-weight:900}
  .def{font-size:17px;line-height:1.5;color:var(--dim)}
  .hint{position:absolute;bottom:16px;font-size:12px;color:#8891a1}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap;max-width:640px;margin-left:auto;margin-right:auto}
  .dot{width:9px;height:9px;border-radius:999px;background:var(--stroke);cursor:pointer}
  .dot.active{background:var(--accent)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;font-size:12.5px;color:#8891a1;max-width:640px;margin-left:auto;margin-right:auto}
  .wordmark{font-weight:900;letter-spacing:2px}
  .wordmark .c{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OSCP <span class="accent">Flashcards</span></h1><div class="sub">Module 8 &middot; Common Web Application Attacks</div></header>
  <div class="toolbar">
    <button class="btn" id="prevBtn">⟨ Prev</button>
    <span class="counter" id="counter">1 / 16</span>
    <button class="btn" id="nextBtn">Next ⟩</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
  </div>
  <div class="stage"><div class="scene"><div class="card" id="card">
    <div class="face front"><div class="tag" id="tagFront">Traversal</div><div class="term" id="termText">Term</div><div class="hint">Tap card to reveal definition</div></div>
    <div class="face back"><div class="tag" id="tagBack">Traversal</div><div class="def" id="defText">Definition</div><div class="hint">Tap card to flip back</div></div>
  </div></div></div>
  <div class="dots" id="dots"></div>
  <div class="foot"><div>My Cyber Academy</div><div class="wordmark"><span class="c">OS</span>CP</div></div>
</div>
<script>
const cards = [
  {tag:"Traversal", term:"Directory Traversal", def:"Manipulating a relative path with parent-directory sequences to walk upward and read files outside the intended folder — a read, not an execution."},
  {tag:"Traversal", term:"Absolute vs Relative Path", def:"Absolute paths start from the filesystem root and are unambiguous; relative paths resolve from the current directory and can step outside an intended folder."},
  {tag:"Traversal", term:"Encoding Bypass", def:"Encoding a traversal sequence differently (e.g. %2f) can defeat a filter that only recognises the literal, unencoded pattern."},
  {tag:"File Inclusion", term:"Inclusion vs Traversal", def:"Traversal displays a file's contents as data; file inclusion loads a file and executes its contents as code — the reason inclusion is more severe."},
  {tag:"File Inclusion", term:"LFI (Local File Inclusion)", def:"Includes and executes a file already present on the target server. Requires first planting attacker content somewhere the server will write, e.g. a log file."},
  {tag:"File Inclusion", term:"RFI (Remote File Inclusion)", def:"Includes and executes a file from attacker-controlled infrastructure directly. No planting needed, but depends on remote includes being enabled — often disabled by default."},
  {tag:"File Inclusion", term:"PHP Wrappers", def:"Stream handlers a vulnerable include function may pass through, letting a tester read source code as data (php://filter) instead of having it execute."},
  {tag:"File Upload", term:"File Upload Vulnerability", def:"Weak restriction on uploaded file type, content or destination lets attacker-controlled content be planted on the server — often the planting step LFI needs."},
  {tag:"File Upload", term:"Identifying Upload Weakness", def:"Test whether validation checks only the extension, only a client-supplied content type, or the file's actual content — the gap between these is the exploitable weakness."},
  {tag:"File Upload", term:"Upload Bypass Vectors", def:"Alternate/double extensions, content-type spoofing, magic byte manipulation, and path manipulation — each targets a specific validation gap."},
  {tag:"Command Injection", term:"Command Injection", def:"User input passed unsanitised into a system shell command lets attacker input execute as part of that command — reaching the OS directly, not just the app's own logic."},
  {tag:"Command Injection", term:"Chaining Commands", def:"Shell metacharacters (e.g. ; ) can chain a second, attacker-controlled command onto the one the application intended to run."},
  {tag:"Command Injection", term:"From Injection to System Access", def:"Confirmed command injection is leveraged into an interactive foothold — the same outcome Module 11's exploited public vulnerabilities and Module 19's payloads both aim for."},
  {tag:"Practice", term:"The Four-Attack Chain", def:"Directory traversal reads → file upload plants → file inclusion executes the planted content → command injection reaches the OS shell directly for a foothold."},
  {tag:"Practice", term:"Testing Every Path-Like Parameter", def:"Traversal/inclusion payloads should be tried against every parameter that could resolve to a filesystem path internally — not just obviously-named ones."},
  {tag:"Practice", term:"Pursuing the Chain", def:"After confirming any one of the four vulnerability types, explicitly check whether the other three become reachable before moving on."}
];
let order = cards.map((_,i)=>i); let pos = 0;
const cardEl=document.getElementById('card'),termText=document.getElementById('termText'),defText=document.getElementById('defText'),tagFront=document.getElementById('tagFront'),tagBack=document.getElementById('tagBack'),counter=document.getElementById('counter'),dotsEl=document.getElementById('dots');
function renderDots(){dotsEl.innerHTML='';order.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===pos?' active':'');d.onclick=()=>{pos=i;render();};dotsEl.append(d);});}
function render(){const c=cards[order[pos]];cardEl.classList.remove('flipped');termText.textContent=c.term;defText.textContent=c.def;tagFront.textContent=c.tag;tagBack.textContent=c.tag;counter.textContent=(pos+1)+' / '+order.length;renderDots();}
cardEl.addEventListener('click',()=>cardEl.classList.toggle('flipped'));
document.getElementById('nextBtn').onclick=()=>{pos=(pos+1)%order.length;render();};
document.getElementById('prevBtn').onclick=()=>{pos=(pos-1+order.length)%order.length;render();};
document.getElementById('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('nextBtn').click();if(e.key==='ArrowLeft')document.getElementById('prevBtn').click();if(e.key===' '){e.preventDefault();cardEl.classList.toggle('flipped');}});
render();
</script>
</body>
</html>
