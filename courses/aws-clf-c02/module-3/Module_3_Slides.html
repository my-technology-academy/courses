<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS CLF-C02 — Module 3: Cloud Technology and Services</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#0b0d0f; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #stage { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #slide { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .nav { position:absolute; top:0; height:100%; width:14%; border:0; background:transparent; cursor:pointer; opacity:0; transition:opacity .15s; }
  .nav:hover { opacity:1; background:rgba(255,255,255,.06); }
  #prev { left:0; } #next { right:0; }
  #bar { position:absolute; bottom:0; left:0; right:0; display:flex; align-items:center; gap:12px;
         padding:8px 14px; background:linear-gradient(transparent,rgba(0,0,0,.75)); color:#f5f5f7;
         font-size:13px; opacity:0; transition:opacity .2s; }
  #stage:hover #bar { opacity:1; }
  #bar button { background:#ff6a00; color:#fff; border:0; border-radius:5px; padding:5px 12px;
                 font-size:13px; cursor:pointer; font-weight:600; }
  #bar button:disabled { background:#3a3d42; cursor:default; }
  #counter { font-variant-numeric:tabular-nums; letter-spacing:.03em; }
  #track { flex:1; height:3px; background:#3a3d42; border-radius:2px; overflow:hidden; }
  #fill { height:100%; width:0; background:#ff6a00; transition:width .2s; }
</style>
</head>
<body>
<div id="stage">
  <img id="slide" alt="Slide">
  <button class="nav" id="prev" aria-label="Previous slide"></button>
  <button class="nav" id="next" aria-label="Next slide"></button>
  <div id="bar">
    <button id="bprev">Prev</button>
    <button id="bnext">Next</button>
    <span id="counter"></span>
    <div id="track"><div id="fill"></div></div>
  </div>
</div>
<script>
  const SLIDES = ["slide-001.jpg", "slide-002.jpg", "slide-003.jpg", "slide-004.jpg", "slide-005.jpg", "slide-006.jpg", "slide-007.jpg", "slide-008.jpg", "slide-009.jpg", "slide-010.jpg", "slide-011.jpg", "slide-012.jpg", "slide-013.jpg", "slide-014.jpg", "slide-015.jpg", "slide-016.jpg", "slide-017.jpg", "slide-018.jpg", "slide-019.jpg", "slide-020.jpg", "slide-021.jpg", "slide-022.jpg", "slide-023.jpg", "slide-024.jpg", "slide-025.jpg", "slide-026.jpg", "slide-027.jpg", "slide-028.jpg", "slide-029.jpg", "slide-030.jpg", "slide-031.jpg", "slide-032.jpg", "slide-033.jpg", "slide-034.jpg", "slide-035.jpg", "slide-036.jpg", "slide-037.jpg", "slide-038.jpg", "slide-039.jpg", "slide-040.jpg", "slide-041.jpg", "slide-042.jpg", "slide-043.jpg", "slide-044.jpg", "slide-045.jpg", "slide-046.jpg", "slide-047.jpg", "slide-048.jpg", "slide-049.jpg", "slide-050.jpg", "slide-051.jpg", "slide-052.jpg", "slide-053.jpg", "slide-054.jpg", "slide-055.jpg", "slide-056.jpg", "slide-057.jpg", "slide-058.jpg"];
  let i = 0;
  const img = document.getElementById('slide');
  const counter = document.getElementById('counter');
  const fill = document.getElementById('fill');
  const bprev = document.getElementById('bprev');
  const bnext = document.getElementById('bnext');
  function render() {
    img.src = SLIDES[i];
    img.alt = 'Slide ' + (i + 1) + ' of ' + SLIDES.length;
    counter.textContent = (i + 1) + ' / ' + SLIDES.length;
    fill.style.width = ((i + 1) / SLIDES.length * 100) + '%';
    bprev.disabled = i === 0;
    bnext.disabled = i === SLIDES.length - 1;
    if (i + 1 < SLIDES.length) { new Image().src = SLIDES[i + 1]; }
  }
  function go(d) { const n = i + d; if (n >= 0 && n < SLIDES.length) { i = n; render(); } }
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  bprev.onclick = () => go(-1);
  bnext.onclick = () => go(1);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
    if (e.key === 'Home') { i = 0; render(); }
    if (e.key === 'End') { i = SLIDES.length - 1; render(); }
  });
  render();
</script>
</body>
</html>
