<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 7 Flashcards — Attacking Model Context Protocol and Tool Surfaces</title>
<style>
  :root{--bg:#0c0d10;--card:#111217;--stroke:#2a2f3a;--accent:#ff6a00;--text:#f5f7fb;--dim:#b8c0cf}
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg);background-image:radial-gradient(1000px 600px at -10% -20%, rgba(255,106,0,.20), transparent 50%);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 24px 60px}
  header{text-align:center;margin-bottom:28px}
  h1{margin:0;font-size:30px;font-weight:900}
  h1 .accent{color:var(--accent)}
  .sub{color:var(--dim);font-size:14px;margin-top:8px}
  .toolbar{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .btn{border:1px solid var(--stroke);background:rgba(255,255,255,.02);color:var(--text);padding:9px 16px;border-radius:12px;cursor:pointer;font-size:14px}
  .btn:hover{background:rgba(255,106,0,.10)}
  .counter{color:var(--dim);font-size:14px}
  .stage{display:flex;justify-content:center}
  .scene{width:100%;max-width:640px;height:360px;perspective:1600px}
  .card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .card.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--stroke);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--card)}
  .face.front{background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.15)), var(--card)}
  .face.back{transform:rotateY(180deg);background:linear-gradient(180deg, rgba(255,106,0,.10), rgba(0,0,0,.15)), var(--card);border-color:#b85100}
  .tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:700;letter-spacing:.5px;color:#ffd9bf;background:rgba(255,106,0,.15);border:1px solid rgba(255,106,0,.35);padding:4px 10px;border-radius:999px}
  .term{font-size:23px;font-weight:900}
  .def{font-size:17px;line-height:1.5;color:var(--dim)}
  .hint{position:absolute;bottom:16px;font-size:12px;color:#8891a1}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:24px;flex-wrap:wrap;max-width:640px;margin-left:auto;margin-right:auto}
  .dot{width:9px;height:9px;border-radius:999px;background:var(--stroke);cursor:pointer}
  .dot.active{background:var(--accent)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:40px;font-size:12.5px;color:#8891a1;max-width:640px;margin-left:auto;margin-right:auto}
  .wordmark{font-weight:900;letter-spacing:2px}
  .wordmark .c{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>OSAI <span class="accent">Flashcards</span></h1><div class="sub">Module 7 &middot; Attacking Model Context Protocol and Tool Surfaces</div></header>
  <div class="toolbar">
    <button class="btn" id="prevBtn">⟨ Prev</button>
    <span class="counter" id="counter">1 / 16</span>
    <button class="btn" id="nextBtn">Next ⟩</button>
    <button class="btn" id="shuffleBtn">Shuffle</button>
  </div>
  <div class="stage"><div class="scene"><div class="card" id="card">
    <div class="face front"><div class="tag" id="tagFront">Automation</div><div class="term" id="termText">Term</div><div class="hint">Tap card to reveal definition</div></div>
    <div class="face back"><div class="tag" id="tagBack">Automation</div><div class="def" id="defText">Definition</div><div class="hint">Tap card to flip back</div></div>
  </div></div></div>
  <div class="dots" id="dots"></div>
  <div class="foot"><div>My Cyber Academy</div><div class="wordmark"><span class="c">OS</span>AI</div></div>
</div>
<script>
const cards = [
 {
  "tag": "MCP Fundamentals",
  "term": "Model Context Protocol (MCP), conceptually",
  "def": "A standardised interface pattern that lets a model or agent discover what external tool capabilities exist and invoke them, rather than each application wiring up its own bespoke tool integration."
 },
 {
  "tag": "MCP Fundamentals",
  "term": "Discovery Phase",
  "def": "The phase in which a model/agent learns what tools are available and reads whatever description or metadata accompanies each one, before any tool is invoked."
 },
 {
  "tag": "MCP Fundamentals",
  "term": "Invocation Phase",
  "def": "The phase in which a model/agent requests execution of a specific tool, supplying concrete input, and the tool's result re-enters the model's working context."
 },
 {
  "tag": "MCP Fundamentals",
  "term": "Tool-Providing Side (Provider)",
  "def": "The component that exposes one or more tools, each described in some way so a consumer (model/agent) can understand what it does."
 },
 {
  "tag": "Tool Enumeration",
  "term": "Systematic Tool-Surface Enumeration",
  "def": "The disciplined process of identifying every tool a model or agent can reach, directly or transitively, rather than confirming a single tool's existence and moving on."
 },
 {
  "tag": "Tool Enumeration",
  "term": "Transitive Enumeration",
  "def": "Identifying tools reachable only indirectly — a tool that itself can trigger another tool or agent, extending the surface beyond what is immediately visible."
 },
 {
  "tag": "Tool Enumeration",
  "term": "Excessive Agency (LLM06)",
  "def": "OWASP's Top 10 for LLM Applications risk describing a model or agent holding more standing permission, autonomy, or tool access than its actual task requires."
 },
 {
  "tag": "Tool Enumeration",
  "term": "Crafted-Parameter Abuse",
  "def": "Calling a legitimate, intended tool with parameters chosen to redirect its effect toward an unintended target or outcome, without the call itself looking unusual."
 },
 {
  "tag": "Trust Weaknesses",
  "term": "Tool-Description Injection Risk",
  "def": "The risk that a model trusts a tool's declared description or capability without independent verification, so untrusted text describing what a tool does can itself carry an instruction."
 },
 {
  "tag": "Trust Weaknesses",
  "term": "Capability Over-Claiming",
  "def": "A tool's description asserts broader or different capability than it actually has, misleading the model's choice of when to invoke it."
 },
 {
  "tag": "Trust Weaknesses",
  "term": "Compromised Third-Party Provider",
  "def": "A tool-providing side operated by a party outside the target organisation that behaves maliciously or has itself been compromised upstream, becoming part of the attack surface."
 },
 {
  "tag": "Trust Weaknesses",
  "term": "Unverified Provenance",
  "def": "The agent has no independent way to confirm that a discovered tool genuinely belongs to, or is authorised by, the party it claims to represent."
 },
 {
  "tag": "Reporting",
  "term": "Least-Privilege Gap",
  "def": "A tool grant that exceeds what the observed task requires — the direct, reportable form of the excessive-agency concept applied to a specific tool-surface finding."
 },
 {
  "tag": "Reporting",
  "term": "Missing Tool-Output Validation",
  "def": "The agent treats a tool's returned result as trusted context without sanitisation — a Module 3 weakness confirmed at report-ready evidence quality in Module 7."
 },
 {
  "tag": "Reporting",
  "term": "Missing Tool-Description Validation",
  "def": "The agent treats a tool's declared description or metadata as trustworthy without independent verification, reported as a distinct finding category from output validation."
 },
 {
  "tag": "Reporting",
  "term": "Agent-and-Tool Attack-Surface Layer",
  "def": "The Module 1 six-layer attack-surface category that every finding in this module belongs to — the consistent structural home for tool-surface evidence in the final report."
 }
];
let order = cards.map((_,i)=>i); let pos = 0;
const cardEl=document.getElementById('card'),termText=document.getElementById('termText'),defText=document.getElementById('defText'),tagFront=document.getElementById('tagFront'),tagBack=document.getElementById('tagBack'),counter=document.getElementById('counter'),dotsEl=document.getElementById('dots');
function renderDots(){dotsEl.innerHTML='';order.forEach((_,i)=>{const d=document.createElement('div');d.className='dot'+(i===pos?' active':'');d.onclick=()=>{pos=i;render();};dotsEl.append(d);});}
function render(){const c=cards[order[pos]];cardEl.classList.remove('flipped');termText.textContent=c.term;defText.textContent=c.def;tagFront.textContent=c.tag;tagBack.textContent=c.tag;counter.textContent=(pos+1)+' / '+order.length;renderDots();}
cardEl.addEventListener('click',()=>cardEl.classList.toggle('flipped'));
document.getElementById('nextBtn').onclick=()=>{pos=(pos+1)%order.length;render();};
document.getElementById('prevBtn').onclick=()=>{pos=(pos-1+order.length)%order.length;render();};
document.getElementById('shuffleBtn').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;render();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('nextBtn').click();if(e.key==='ArrowLeft')document.getElementById('prevBtn').click();if(e.key===' '){e.preventDefault();cardEl.classList.toggle('flipped');}});
render();
</script>
</body>
</html>
